[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aquapulse"
version = "1.0.0"
description = "Interactive aquatic ecosystem simulator, fish doctor, breeding forecaster, and nitrogen-cycle forecaster"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AquaPulse" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aquapulse" = ["static/*", "*.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
